<script>
    // 1. FINAL VERIFIED RAZORPAY LINKS (From your screenshot)
    const razorpayLinks = {
        "excel_monthly": "https://rzp.io/rzp/3tMcy2DP",
        "excel_yearly": "https://rzp.io/rzp/o0bSkz2",
        "outlook_monthly": "https://rzp.io/rzp/EOtRn0Q",
        "outlook_yearly": "https://rzp.io/rzp/GwMnfJT",
        "google_monthly": "https://rzp.io/rzp/8tS0tqLc",
        "google_yearly": "https://rzp.io/rzp/uB9Ktj6e",
        "crm_monthly": "https://rzp.io/rzp/im1oVmUK",
        "crm_yearly": "https://rzp.io/rzp/OSgdXGx"
    };

    // 2. FINAL TOTAL PRICES (Setup + License)
    const prices = {
        "excel_monthly": "₹16,000",
        "excel_yearly": "₹50,300",
        "outlook_monthly": "₹25,500",
        "outlook_yearly": "₹69,600",
        "google_monthly": "₹33,000",
        "google_yearly": "₹91,800",
        "crm_monthly": "₹44,500",
        "crm_yearly": "₹137,600"
    };

    const names = {
        "excel": "Excel Optimizer",
        "outlook": "Outlook Pipeline",
        "google": "Cloud Integrator",
        "crm": "CRM Dynamic Sync"
    };

    // 3. UI SYNC FUNCTION
    function forceSync() {
        const urlParams = new URLSearchParams(window.location.search);
        const plan = (urlParams.get('plan') || "excel").toLowerCase().trim();
        const cycle = (urlParams.get('cycle') || "monthly").toLowerCase().trim();
        const fullKey = plan + "_" + cycle;

        const displayPlan = (names[plan] || "Excel Optimizer") + " (" + cycle.toUpperCase() + ")";
        const displayPrice = prices[fullKey] || "₹16,000";

        // Update Visible Labels
        document.getElementById('display-plan').innerText = displayPlan;
        document.getElementById('display-price').innerText = displayPrice;
        document.getElementById('plan-banner').innerText = "PROCEEDING WITH: " + (names[plan] || "EXCEL").toUpperCase();
        
        // Update Hidden Form Fields for Formspree
        document.getElementById('hidden-plan').value = displayPlan;
        document.getElementById('hidden-price').value = displayPrice;

        if(cycle === 'yearly') {
            document.getElementById('billing-cycle-text').innerText = "Annual Total + GST";
            document.getElementById('billing-cycle-text').style.color = "#2563eb";
        }
    }

    // 4. SUBMIT AND REDIRECT
    const billingForm = document.getElementById("billing-form");
    billingForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        const submitBtn = document.getElementById("submit-btn");
        submitBtn.disabled = true; 
        submitBtn.innerText = "CAPTURING ORDER...";

        const params = new URLSearchParams(window.location.search);
        const p = (params.get('plan') || "excel").toLowerCase().trim();
        const c = (params.get('cycle') || "monthly").toLowerCase().trim();
        const key = p + "_" + c;

        try {
            // Log lead to Formspree
            await fetch(billingForm.action, {
                method: 'POST',
                body: new FormData(billingForm),
                headers: { 'Accept': 'application/json' }
            });

            submitBtn.innerText = "REDIRECTING...";
            window.location.href = razorpayLinks[key];
        } catch (err) {
            // Safety fallback to payment portal
            window.location.href = razorpayLinks[key];
        }
    });

    // Run Sync on Start
    forceSync();
</script>
